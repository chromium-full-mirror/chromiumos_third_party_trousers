description     "TrouSerS daemon"
author          "chromium-os-dev@chromium.org"

# The TrouSerS daemon implements TSS, a standard API for access to
# TPM hardware (or to a TPM emulator).
#
# No 'start on'; the job is started with 'start' from tpm-probe.
stop on hwsec-stop-low-level-tpm-daemon-signal
respawn

oom score -100

pre-start script
  exec /bin/sh /usr/share/cros/init/tcsd-pre-start.sh
end script

post-stop script
  # Save the TPM state with the raw TPM command.
  # tag = 0x00c1 = no auth
  # size = 10 = 0x0000000a
  # command_code = TPM_ORD_SaveState = 0x00000098
  bash -c 'exec 3<>/dev/tpm0 && \
    ( printf "\x00\xc1\x00\x00\x00\x0a\x00\x00\x00\x98" | cat ) >&3 && \
    cat <&3' || logger -t "$UPSTART_JOB" "final TPM savestate: $?"
end script

expect fork
exec tcsd
